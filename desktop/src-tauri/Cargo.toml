[package]
name = "cad-copilot-desktop"
version = "0.1.0"
description = "CAD Copilot desktop client host"
authors = ["Jitendra Patwari"]
edition = "2021"

[lib]
name = "cad_copilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jsonschema = { version = "0.28", default-features = false }

[features]
test-support = []
packaged-engine = []

[dev-dependencies]
cad-copilot-desktop = { path = ".", features = ["test-support"] }
