<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Outer border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />
  <!-- Isometric CAD Hexagon/Cube -->
  <!-- Top Face -->
  <polygon points="256,120 380,188 256,256 132,188" fill="url(#top)" />
  <!-- Left Face -->
  <polygon points="132,188 256,256 256,392 132,324" fill="url(#left)" />
  <!-- Right Face -->
  <polygon points="256,256 380,188 380,324 256,392" fill="url(#right)" />
  <!-- Cylindrical Cutout / Precision Bore on Top Face -->
  <ellipse cx="256" cy="188" rx="44" ry="24" fill="#0f172a" opacity="0.7" />
  <ellipse cx="256" cy="188" rx="36" ry="19" fill="#0284c7" opacity="0.3" />
  <!-- Copilot Spark / Compass Pointer Accent -->
  <path d="M 370,130 L 385,160 L 415,175 L 385,190 L 370,220 L 355,190 L 325,175 L 355,160 Z" fill="url(#accent)" />
</svg>
