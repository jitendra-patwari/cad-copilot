name: Bug Report
description: Report a bug or unexpected behavior in CAD Copilot
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of CAD Copilot are you using? (e.g. 0.1.0 or commit hash)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running?
      options:
        - Windows 11
        - Windows 10
        - macOS (Mock / Offline Mode)
        - Linux (Mock / Offline Mode)
    validations:
      required: true
  - type: input
    id: cad_version
    attributes:
      label: Solid Edge Version
      description: If applicable, what version of Siemens Solid Edge is installed? (or N/A for Mock Mode)
      placeholder: "Solid Edge 2026 / N/A"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Launch CAD Copilot
        2. Enter prompt: "..."
        3. Click "Generate"
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Please paste any relevant console output or stack traces.
      render: shell
