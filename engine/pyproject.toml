[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-copilot"
version = "0.1.0"
description = "Prompt-first CAD engine, geometry lowering, Solid Edge COM driver, and local batch automation."
readme = "README.md"
requires-python = ">=3.14.3,<3.15"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
