[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-copilot"
version = "0.1.0"
description = "Prompt-first CAD engine, geometry lowering, COM bridge, and local API server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.10.0",
    "jsonschema>=4.20.0",
    "google-genai>=0.1.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
]

[project.scripts]
cad-copilot-bridge = "ipc.server:main"
cad-copilot-batch = "batch.hub:main"
cad-copilot-edit = "editor.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
